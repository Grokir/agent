[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "14"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
anyhow = "1"
async-trait = "0.1"
roxmltree = "0.20"
toml = "0.8"
